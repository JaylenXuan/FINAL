<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIE1101 — Campus Sandbox (prototype)</title>
  <style>
    :root {
      --ink: #10131a;
      --paper: #f4f1ea;
      --accent: #d8352a;
      --star: #e0a020;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
    body { font-family: "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      color: var(--paper); font-size: 13px; letter-spacing: .04em;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }
    #hud-top { position: absolute; top: 18px; left: 20px; display: flex; align-items: center; gap: 18px; }
    #stars { display: flex; gap: 6px; }
    #stars i {
      width: 14px; height: 14px; display: block;
      background: rgba(255,255,255,.15);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      transition: background .2s, transform .2s;
    }
    #stars i.on { background: var(--star); transform: scale(1.15); }
    #zone { opacity: .75; text-transform: uppercase; }
    #hint { position: absolute; bottom: 18px; left: 20px; opacity: .55; line-height: 1.7; }
    #hint b { color: var(--paper); font-weight: 600; }

    /* ---------- subtitle ---------- */
    #subtitle {
      position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
      max-width: 720px; text-align: center; opacity: 0;
      transition: opacity .18s;
    }
    #subtitle.show { opacity: 1; }
    #subtitle .en { font-size: 19px; line-height: 1.4; }
    #subtitle .zh { font-size: 13px; opacity: .68; margin-top: 4px; }

    /* ---------- phone ---------- */
    #phone {
      position: absolute; right: 26px; bottom: 26px; width: 168px; height: 300px;
      border-radius: 20px; border: 2px solid rgba(255,255,255,.28);
      background: linear-gradient(160deg, rgba(28,32,44,.94), rgba(12,14,20,.96));
      transform: translateY(120%); transition: transform .22s cubic-bezier(.2,.9,.2,1);
      padding: 16px 12px; display: flex; flex-direction: column; gap: 10px;
    }
    #phone.up { transform: translateY(0); }
    #phone .bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.16); }
    #phone .bar.short { width: 55%; }
    #phone .app { flex: 1; border-radius: 12px; background: rgba(255,255,255,.06); }

    /* ---------- class question ---------- */
    #classq {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(6,8,12,.55); backdrop-filter: blur(2px);
    }
    #classq.show { display: flex; }
    #classq .card {
      width: 560px; background: rgba(244,241,234,.97); color: var(--ink);
      border-radius: 3px; padding: 26px 28px 22px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }
    #classq .q { font-size: 18px; font-weight: 600; margin-bottom: 18px; }
    #classq .opt {
      display: flex; gap: 12px; align-items: center; padding: 10px 12px; margin-bottom: 8px;
      border: 1px solid rgba(16,19,26,.16); border-radius: 3px; font-size: 15px;
    }
    #classq .opt kbd {
      width: 22px; height: 22px; display: grid; place-items: center;
      background: var(--ink); color: var(--paper); border-radius: 3px; font-size: 12px;
    }

    /* ---------- blackout + anchor picker ---------- */
    #black {
      position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--paper); transition: opacity .25s;
    }
    #black.show { opacity: 1; pointer-events: auto; }
    #black .title { font-size: 46px; letter-spacing: .3em; text-transform: uppercase; }
    #black .sub { font-size: 13px; opacity: .5; margin-top: 10px; letter-spacing: .2em; }
    #anchors { margin-top: 42px; display: none; flex-direction: column; gap: 10px; width: 320px; }
    #anchors.show { display: flex; }
    #anchors .row {
      display: flex; align-items: center; gap: 14px; padding: 11px 16px;
      border: 1px solid rgba(244,241,234,.18); border-radius: 2px;
      font-size: 15px; letter-spacing: .06em; opacity: .45; transition: all .12s;
    }
    #anchors .row.sel { opacity: 1; border-color: var(--paper); background: rgba(244,241,234,.1); }
    #anchors .row kbd { opacity: .7; font-size: 12px; }

    /* ---------- wake vignette ---------- */
    #wake {
      position: fixed; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 55%, rgba(0,0,0,0) 20%, rgba(0,0,0,.92) 78%);
      transition: opacity .35s;
    }
    #wake.show { opacity: 1; }

    /* ---------- boot ---------- */
    #boot {
      position: fixed; inset: 0; background: #0b0d12; color: var(--paper);
      display: grid; place-items: center; font-size: 13px; letter-spacing: .3em;
      text-transform: uppercase; transition: opacity .4s;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="hud-top">
      <div id="stars"><i></i><i></i><i></i></div>
      <div id="zone">Plaza</div>
    </div>
    <div id="hint">
      <b>WASD</b> move &nbsp; <b>Shift</b> run &nbsp; <b>E</b> interact &nbsp; <b>Tab</b> phone<br />
      <b>1-4</b> teleport &nbsp; <b>F</b> force bit &nbsp; <b>R</b> reset
    </div>
    <div id="subtitle"><div class="en"></div><div class="zh"></div></div>
    <div id="phone">
      <div class="bar short"></div>
      <div class="app"></div>
      <div class="bar"></div>
      <div class="bar short"></div>
    </div>
  </div>

  <div id="classq">
    <div class="card">
      <div class="q">Which one did Principal Xu actually say?</div>
      <div class="opt" data-opt="1"><kbd>1</kbd><span>Ranking 260 in the gaokao beats 2,600.</span></div>
      <div class="opt" data-opt="2"><kbd>2</kbd><span>Walk while you're on your phone.</span></div>
      <div class="opt" data-opt="3"><kbd>3</kbd><span>Parents, stop micromanaging your kid's college life.</span></div>
    </div>
  </div>

  <div id="black">
    <div class="title"></div>
    <div class="sub"></div>
    <div id="anchors"></div>
  </div>

  <div id="wake"></div>
  <div id="boot">loading campus</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
